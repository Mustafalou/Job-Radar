name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read
  packages: write           # autorise la publication sur ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement, rien à créer
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mustafalou/job-radar:latest
            ghcr.io/mustafalou/job-radar:${{ github.sha }}
  deploy:
    needs: build                         # attend que l'image soit publiée
    if: github.ref == 'refs/heads/main'  # seule la branche main est autorisée par Azure
    runs-on: ubuntu-latest
    permissions:
      id-token: write                    # permet à GitHub de prouver son identité à Azure (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4          # pour récupérer profile.md
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deployer la nouvelle image
        run: |
          IMAGE=ghcr.io/mustafalou/job-radar:${{ github.sha }}
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n ca-jobradar-api -g rg-jobradar --image $IMAGE
          az containerapp job update -n caj-jobradar-daily -g rg-jobradar --image $IMAGE

      - name: Envoyer profile.md et cv_base.json sur le partage Azure Files
        run: |
          KEY=$(az storage account keys list -n stjobradarmay -g rg-jobradar --query "[0].value" -o tsv)
          for f in profile.md cv_base.json; do
            az storage file upload --account-name stjobradarmay --account-key "$KEY" \
              --share-name jobradar-data --source "$f" --path "$f" --only-show-errors
          done

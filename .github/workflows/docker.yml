name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: read
  packages: write           # autorise la publication sur ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement, rien à créer
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mustafalou/job-radar:latest
            ghcr.io/mustafalou/job-radar:${{ github.sha }}
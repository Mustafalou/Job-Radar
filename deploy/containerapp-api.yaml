# Modèle de l'app Container Apps du tableau de bord (FastAPI).
# Les valeurs __EN_MAJUSCULES__ sont remplacées par sed : voir docs/installation-azure.md, étape 6.
location: __LOCATION__
identity:
  type: SystemAssigned      # identité managée : lit Key Vault et appelle Foundry sans clé
properties:
  managedEnvironmentId: __ENV_ID__
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true        # accessible depuis internet (protégé ensuite par la connexion Microsoft)
      targetPort: 8000      # le port d'uvicorn dans le Dockerfile
      transport: auto
  template:
    containers:
      - name: api
        image: __IMAGE__
        resources:
          cpu: 0.25         # l'API n'utilise pas le modèle d'embeddings : très léger
          memory: 0.5Gi
        volumeMounts:
          - volumeName: data
            mountPath: /data   # JOBRADAR_DB=/data/jobs.db (défini dans le Dockerfile)
    scale:
      minReplicas: 0        # s'éteint quand personne ne visite : 0 € au repos
      maxReplicas: 1        # jamais 2 écrivains SQLite en même temps
    volumes:
      - name: data
        storageType: AzureFile
        storageName: jobradardata
        mountOptions: "nobrl,dir_mode=0777,file_mode=0777"   # nobrl : évite "database is locked" avec SQLite
